services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      DB_USER: ${DB_USERNAME}
      DB_PWD: ${DB_PASSWORD}
    depends_on:
      people-db:
        condition: service_healthy
  people-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
